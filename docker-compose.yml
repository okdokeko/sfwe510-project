services:
  product-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: "products"
    networks:
      backend:
        aliases:
          - "product-db"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  orders-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: "orders"
    networks:
      backend:
        aliases:
          - "orders-db"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  configserver:
    build: ./configserver
    ports:
      - "8089:8089"
    environment:
      SERVER_PORT: "8089"
      ENCRYPT_KEY: "fje83Ki8403Iod87dne7Yjsl3THueh48jfuO9j4U2hf64Lo"
    networks:
      backend:
        aliases:
          - "configserver"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  productservice:
    build: ./product-service
    environment:
      SPRING_CLOUD_CONFIG_URI: "http://configserver:8089"
      SPRING_PROFILES_ACTIVE: ${PROFILE:-dev}
      CONFIGSERVER_URI: "http://configserver:8089"
      CONFIGSERVER_PORT: "8089"
      DATABASESERVER_PORT: "5432"
      ENCRYPT_KEY: "IMSYMMETRIC"
      DB_USER: "postgres"
      DB_PASSWORD: "pass"
    depends_on:
      product-db:
        condition: service_healthy
      configserver:
        condition: service_healthy
    ports:
      - "8088:8088"
    networks:
      - backend
  orderservice:
    build: ./order-service
    environment:
      SPRING_CLOUD_CONFIG_URI: "http://configserver:8089"
      SPRING_PROFILES_ACTIVE: ${PROFILE:-dev}
      CONFIGSERVER_URI: "http://configserver:8089"
      CONFIGSERVER_PORT: "8089"
      DATABASESERVER_PORT: "5432"
      ENCRYPT_KEY: "IMSYMMETRIC"
      DB_USER: "postgres"
      DB_PASSWORD: "pass"
    depends_on:
      orders-db:
        condition: service_healthy
      configserver:
        condition: service_healthy
    ports:
      - "8087:8087"
    networks:
      - backend
networks:
  backend:
    driver: bridge