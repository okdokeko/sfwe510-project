services:
  product-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: "products"
    networks:
      backend:
        aliases:
          - "product-db"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  orders-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: "orders"
    networks:
      backend:
        aliases:
          - "orders-db"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  configserver:
    build: ./configserver
    ports:
      - "8089:8089"
    environment:
      SERVER_PORT: "8089"
      ENCRYPT_KEY: "fje83Ki8403Iod87dne7Yjsl3THueh48jfuO9j4U2hf64Lo"
    networks:
      backend:
        aliases:
          - "configserver"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  productservice:
    build: ./product-service
    environment:
      SPRING_CLOUD_CONFIG_URI: "http://configserver:8089"
      SPRING_PROFILES_ACTIVE: ${PROFILE:-dev}
      CONFIGSERVER_URI: "http://configserver:8089"
      CONFIGSERVER_PORT: "8089"
      DATABASESERVER_PORT: "5432"
      ENCRYPT_KEY: "IMSYMMETRIC"
      DB_USER: "postgres"
      DB_PASSWORD: "pass"
    depends_on:
      product-db:
        condition: service_healthy
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    networks:
      - backend
  orderservice:
    build: ./order-service
    environment:
      SPRING_CLOUD_CONFIG_URI: "http://configserver:8089"
      SPRING_PROFILES_ACTIVE: ${PROFILE:-dev}
      CONFIGSERVER_URI: "http://configserver:8089"
      CONFIGSERVER_PORT: "8089"
      DATABASESERVER_PORT: "5432"
      ENCRYPT_KEY: "IMSYMMETRIC"
      DB_USER: "postgres"
      DB_PASSWORD: "pass"
    depends_on:
      orders-db:
        condition: service_healthy
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    networks:
      - backend

  eurekaserver:
    build: ./eurekaserver
    ports:
      - "8070:8070"
    depends_on:
      configserver:
        condition: service_healthy
    networks:
      backend:
        aliases:
          - "eurekaserver"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8070/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  gatewayserver:
    build: ./gatewayserver
    ports:
      - "8072:8072"
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    networks:
      backend:
        aliases:
          - "gatewayserver"
  keycloak:
    image: quay.io/keycloak/keycloak:16.1.1
    command: ["-b", "0.0.0.0", "-Dkeycloak.import=/opt/jboss/keycloak/realm-export.json"]
    environment:
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: admin
    volumes:
      - ./keycloak/realm-export.json:/opt/jboss/keycloak/realm-export.json
    ports:
      - "8080:8080"
    networks:
      backend:
        aliases:
          - "keycloak"
  mailpit: # found this quick SMTP serverfor the email/pswd reminder: https://mailpit.axllent.org/
    image: axllent/mailpit
    ports:
      - "8025:8025"
    networks:
      backend:
        aliases:
          - "mailpit"

networks:
  backend:
    driver: bridge